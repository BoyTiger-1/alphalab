# Runs the AlphaLab paper bot in the cloud, so trading happens with your computer off.
#
# We want the bot acting about once a minute for the whole session. GitHub's scheduler is best-effort,
# and in practice it fires the every-5-minutes cron only two or three times a day, hours late (runs
# landed around 17:30, 20:30 and 23:00 UTC, the last one after the close). Short supervisors that each
# trade for 14 minutes therefore covered only ~30 minutes of a 6.5-hour session.
#
# So the cron is now just a doorbell. Whichever fire lands first starts ONE long supervisor that:
#   - waits for the open if it arrived early (the early-morning crons below exist for this),
#   - runs the bot every ~60 seconds until Alpaca's clock says the market has closed,
#   - and, if it reaches GitHub's 6-hour job limit while the market is still open, starts a fresh copy
#     of itself (workflow_dispatch with chain=true) that picks up where it left off.
# Market hours, holidays and early closes all come from Alpaca's clock (bot/session.js).
#
# Honest limit: the first fire of the day still depends on GitHub. If the earliest one lands at 17:30
# UTC, the morning is missed that day. For a guaranteed start at the open, trigger this workflow from an
# always-on scheduler (see bot/README.md).
#
# This repo is public, so GitHub Actions minutes are free and unlimited.
#
# Setup you do once (see bot/README.md for the click-by-click):
#   Settings -> Secrets and variables -> Actions -> New repository secret
#     ALPACA_KEY_ID       = your paper key id
#     ALPACA_SECRET_KEY   = your paper secret key
#   Optional second paper account, traded on the same brain in the same run:
#     ALPACA_KEY_ID_2     = second paper key id
#     ALPACA_SECRET_KEY_2 = second paper secret key
# The keys live only in encrypted GitHub secrets. They are never in the code or the logs.
#
# Note: GitHub disables scheduled workflows after 60 days with no repo activity. Any push resets that,
# or open the Actions tab and re-enable it.

name: AlphaLab paper bot

on:
  schedule:
    - cron: '7,37 8-12 * * 1-5'    # early doorbells: GitHub runs these late, so one usually lands before or near the 13:30/14:30 UTC open
    - cron: '*/5 13-21 * * 1-5'    # and every 5 min through the session in case the morning ones were dropped
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (compute and log orders without sending any)'
        type: boolean
        default: false
      chain:
        description: 'Run as a full-session supervisor (set automatically when a supervisor hands off)'
        type: boolean
        default: false

# only one supervisor at a time, so accounts are never double-traded. Doorbells that ring while one is
# running just wait, then see the supervisor already covered the day and exit in seconds.
concurrency:
  group: alphalab-paper-bot
  cancel-in-progress: false

permissions:
  contents: read
  actions: write     # lets a supervisor start its own successor before the 6-hour job limit

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run the bot
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_KEY_ID_2: ${{ secrets.ALPACA_KEY_ID_2 }}       # optional: a second paper account, traded on the same brain
          ALPACA_SECRET_KEY_2: ${{ secrets.ALPACA_SECRET_KEY_2 }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}   # optional: your own live-quote key, else the public one is used
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
          SUPERVISE: ${{ (github.event_name == 'schedule' || github.event.inputs.chain == 'true') && '1' || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Preflight: without the paper keys every iteration would fail identically. Fail loudly instead.
          if [ -z "$ALPACA_KEY_ID" ] || [ -z "$ALPACA_SECRET_KEY" ]; then
            echo "::error title=Alpaca keys not set::Add ALPACA_KEY_ID and ALPACA_SECRET_KEY as repository secrets (Settings -> Secrets and variables -> Actions), then re-run. See bot/README.md."
            exit 1
          fi
          if [ -z "$SUPERVISE" ]; then
            node bot/run.js     # manual run from the Actions tab: a single pass (handy for a dry run)
            exit 0
          fi

          # full-session supervisor. Stop 12 minutes short of the job limit so the hand-off is clean.
          end=$(( $(date +%s) + 346 * 60 ))
          state=closed; passes=0
          while [ "$(date +%s)" -lt "$end" ]; do
            read -r state secs < <(node bot/session.js)
            left=$(( end - $(date +%s) ))
            if [ "$state" = "open" ]; then
              t0=$(date +%s)
              node bot/run.js || true
              passes=$(( passes + 1 ))
              # keep the PERIOD at ~60s: a two-account pass takes ~30s, so sleep only the rest of the minute
              rest=$(( 60 - ( $(date +%s) - t0 ) ))
              if [ "$rest" -lt 5 ]; then rest=5; fi
              sleep "$rest"
            elif [ "$state" = "closed" ] && [ "$secs" -lt "$left" ]; then
              # arrived before the open: wait for it (checking every 5 minutes, and waking right at the bell)
              if [ "$passes" -gt 0 ]; then break; fi
              echo "market opens in $(( secs / 60 )) min, waiting"
              if [ "$secs" -lt 300 ]; then sleep $(( secs + 2 )); else sleep 300; fi
            else
              break     # closed for the day (or the clock call failed): nothing more to do
            fi
          done
          echo "supervisor done: $passes passes, market $state"

          # still open at the job limit: hand off to a fresh supervisor so the rest of the session is covered
          if [ "$state" = "open" ] && [ "$(date +%s)" -ge "$end" ]; then
            echo "market still open, starting the next supervisor"
            gh workflow run trade.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f chain=true -f dry_run=false
          fi
