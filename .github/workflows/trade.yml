# Runs the AlphaLab paper bot in the cloud, so trading happens with your computer off.
#
# We want the bot acting about once a minute all session. GitHub's own scheduler cannot fire faster than
# every 5 minutes AND is best-effort: it routinely delays or drops scheduled runs, so a sparse cron
# leaves long dead windows with no trading. So each scheduled run is a short-lived "supervisor" that
# loops internally, trading every ~60 seconds for ~14 minutes, and the cron fires every 5 minutes (the
# fastest GitHub allows). Because a 14-minute supervisor outlives the 5-minute cron interval, the next
# fire is always queued behind the running one (concurrency below serializes them) and starts the instant
# it ends, so the supervisors chain back-to-back and coverage stays continuous even when GitHub skips
# some fires. Each bot call is its own fresh Node process, so live prices and the learning read are
# recomputed clean every minute with no stale state.
#
# Honest limit: nothing inside GitHub Actions can GUARANTEE a trade every single minute, because the
# whole chain depends on GitHub firing the cron at all. This setup makes it as continuous as the free
# tier allows. For a hard per-minute guarantee you need an always-on host (a small VM or a service with
# a real scheduler); see bot/README.md.
#
# This repo is public, so GitHub Actions minutes are free and unlimited, which is what makes the
# overlapping per-minute loop all day practical.
#
# Setup you do once (see bot/README.md for the click-by-click):
#   Settings -> Secrets and variables -> Actions -> New repository secret
#     ALPACA_KEY_ID       = your paper key id
#     ALPACA_SECRET_KEY   = your paper secret key
#   Optional second paper account, traded on the same brain in the same run:
#     ALPACA_KEY_ID_2     = second paper key id
#     ALPACA_SECRET_KEY_2 = second paper secret key
# The keys live only in encrypted GitHub secrets. They are never in the code or the logs.
#
# Note: GitHub disables scheduled workflows after 60 days with no repo activity. Any push resets that,
# or open the Actions tab and re-enable it.

name: AlphaLab paper bot

on:
  schedule:
    - cron: '*/5 13-21 * * 1-5'   # a supervisor every 5 min (GitHub's max), weekdays, 13:00-21:55 UTC (covers 9:30-16:00 ET year round). Supervisors overlap and chain so coverage stays continuous.
  workflow_dispatch:               # also lets you run a single pass by hand from the Actions tab
    inputs:
      dry_run:
        description: 'Dry run (compute and log orders without sending any)'
        type: boolean
        default: false

# never let two supervisors run at once and double-trade; a late one just queues behind the current one
concurrency:
  group: alphalab-paper-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run the bot
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_KEY_ID_2: ${{ secrets.ALPACA_KEY_ID_2 }}       # optional: a second paper account, traded on the same brain
          ALPACA_SECRET_KEY_2: ${{ secrets.ALPACA_SECRET_KEY_2 }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}   # optional: your own live-quote key, else the public one is used
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
        run: |
          # Preflight: without the paper keys the bot cannot reach the account and every iteration
          # would fail identically. Fail the whole run loudly (a red X in the Actions tab) instead of
          # looping for 14 minutes and reporting a misleading green. Add the two secrets under
          # Settings -> Secrets and variables -> Actions, then re-run. See bot/README.md.
          if [ -z "$ALPACA_KEY_ID" ] || [ -z "$ALPACA_SECRET_KEY" ]; then
            echo "::error title=Alpaca keys not set::Add ALPACA_KEY_ID and ALPACA_SECRET_KEY as repository secrets (Settings -> Secrets and variables -> Actions), then re-run. See bot/README.md."
            exit 1
          fi
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # supervisor: trade every ~60s for ~14 minutes, then let the next (already-queued) supervisor
            # take over. We time each loop so the PERIOD is ~60s: a two-account pass takes ~30s, so a flat
            # 60s sleep would drift trades out to ~90s apart. Sleep only the remainder of the minute.
            end=$(( $(date +%s) + 840 ))
            while [ "$(date +%s)" -lt "$end" ]; do
              t0=$(date +%s)
              node bot/run.js || true
              rest=$(( 60 - ( $(date +%s) - t0 ) ))
              if [ "$rest" -lt 5 ]; then rest=5; fi
              if [ $(( $(date +%s) + rest )) -lt "$end" ]; then sleep "$rest"; else break; fi
            done
          else
            # manual run from the Actions tab: a single pass (handy for a dry run)
            node bot/run.js
          fi
