name: Refresh market data & redeploy

on:
  schedule:
    - cron: '40 21 * * 1-5'  # weekdays 21:40 UTC, ~40 min after the US close, same-day bars
    - cron: '17 6 * * 2-6'   # overnight catch-up for late FRED / crypto prints
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download fresh market data (Yahoo / FRED / Coinbase)
        run: |
          python tools/download_data.py
          python tools/download_data_meta.py

      - name: Download alt-data (Wikipedia / GDELT / StockTwits)
        run: python tools/download_altdata.py || echo "alt-data refresh failed, keeping previous snapshot"

      - name: Download full-universe weekly bundles (S&P 500 + total market)
        run: |
          python tools/download_sp500.py || echo "sp500 refresh failed, keeping previous snapshot"
          python tools/download_market.py || echo "market refresh failed, keeping previous snapshot"

      - name: Download fundamentals + news/social feeds
        run: |
          python tools/download_fundamentals.py || echo "fundamentals refresh failed, keeping previous snapshot"
          python tools/download_newsfeed.py || echo "newsfeed refresh failed, keeping previous snapshot"

      - name: Rebuild data bundle and assemble app
        run: |
          python tools/build_bundle.py
          node tools/build_mlcache.js || echo "ML cache build failed, app will train in the browser"
          python tools/assemble.py
          cp dist/alphalab.html docs/index.html
          cp dist/version.json docs/version.json

      - name: Smoke-test the build (real-data checks)
        run: |
          node tools/smoke.js
          node tools/test_firm.js
          node tools/test_decision.js
          node tools/test_command.js
          node tools/test_mlzoo.js --quick

      - name: Commit & push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bundle.js data/altdata.js data/sp500.js data/market.js data/fundamentals.js data/newsfeed.js data/mlcache.js dist/alphalab.html dist/version.json docs/index.html docs/version.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: refresh market snapshot ($(date -u +%F))"
            # main may have moved during the ~1h run; replay the data commit on top (its generated files win).
            # Scratch outputs the job did not commit would block the rebase, so drop them first.
            git reset -q --hard HEAD
            git pull --rebase -X theirs origin main
            python tools/assemble.py && cp dist/alphalab.html docs/index.html && cp dist/version.json docs/version.json
            git add dist/alphalab.html dist/version.json docs/index.html docs/version.json
            git diff --cached --quiet || git commit -m "data: rebuild page after rebase"
            git push
          fi
